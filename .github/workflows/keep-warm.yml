# 배포된 데모가 잠들지 않게 GitHub Actions가 대신 깨워준다.
#
# Render 무료 플랜은 15분간 인바운드 트래픽이 없으면 절전하고, 다음 접속에서
# 기상까지 약 1분이 걸린다. 이 워크플로가 10분마다 /health를 호출해 깨워둔다.
# GitHub 서버에서 돌기 때문에 내 노트북은 꺼도 된다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 끄는 방법 (셋 중 아무거나)
#
#   1) 자동 — 아무것도 안 해도 KEEP_WARM_UNTIL 날짜(한국시간 기준)가 지나면
#      핑을 멈춘다. 아래 env에서 날짜만 고치면 된다.
#
#   2) 수동/즉시 — 저장소 Actions 탭 → 왼쪽 "Keep demo warm" → 우측 "..." →
#      Disable workflow. 워크플로 실행 자체가 멈춘다. 다시 켜려면 Enable.
#
#   3) 영구 — 이 파일을 삭제하고 push.
# ─────────────────────────────────────────────────────────────────────────────
#
# 비용: 이 저장소는 public이라 GitHub Actions 사용량이 무료(분 제한 없음)다.
# 주의: GitHub의 예약 실행은 서버가 붐비면 몇 분 밀릴 수 있다. 정시성이 중요하면
#       cron-job.org(무료, 가입 필요)가 더 정확하다. docs/deploy.md 참고.

name: Keep demo warm

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (절전 기준 15분보다 짧게)
  workflow_dispatch:          # 버튼으로 수동 실행
  push:
    # 이 파일을 수정해 push하면 즉시 한 번 돈다.
    # GitHub은 실행 이력이 0건인 워크플로를 Actions 탭에 보여주지 않는다
    # (해당 URL이 "This workflow does not exist"로 404). 첫 실행을 만들어 등록시키는 용도.
    paths:
      - ".github/workflows/keep-warm.yml"

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: false

env:
  DEMO_URL: "https://dart-detective.onrender.com"
  # 이 날짜(한국시간, 이 날 포함)까지만 깨운다. 지나면 자동으로 핑을 건너뛴다.
  KEEP_WARM_UNTIL: "2026-08-18"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 기한 확인 (한국시간)
        id: gate
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          echo "오늘(KST): $today · 유지 기한: $KEEP_WARM_UNTIL"
          if [[ "$today" > "$KEEP_WARM_UNTIL" ]]; then
            echo "기한이 지났다 — 핑을 건너뛴다."
            echo "너무 자주 도는 게 거슬리면 Actions 탭에서 이 워크플로를 Disable하면 된다."
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: /health 호출 (잠들어 있으면 기상까지 최대 2분 대기)
        if: steps.gate.outputs.expired != 'true'
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/body.json -w '%{http_code}' --max-time 120 "$DEMO_URL/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "OK ($code)"
              cat /tmp/body.json
              exit 0
            fi
            echo "attempt $i: HTTP $code — 재시도"
            sleep 20
          done
          echo "깨우기 실패 — Render 대시보드 Logs를 확인하라"
          exit 1
