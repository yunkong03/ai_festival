# Render Blueprint — 공시 탐정사무소 웹 데모
#
# 사용법:
#   1. 이 파일이 GitHub 저장소 루트에 있어야 한다
#   2. https://dashboard.render.com/blueprints → New Blueprint Instance → 저장소 선택
#   3. Apply → 빌드 로그가 뜬다 (Dockerfile로 빌드)
#
# 무료 플랜 특성:
#   - 750 인스턴스 시간/월
#   - 15분 유휴 시 절전, 다음 접속에서 기상까지 약 1분(로딩 화면이 뜬다)
#   - 디스크 없음(우리 앱은 디스크에 쓰지 않는다)

services:
  - name: dart-detective
    type: web
    runtime: docker
    plan: free
    region: singapore          # 한국에서 가장 가까운 리전
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # 공개 URL이므로 LLM은 꺼서 올린다. 켜려면 Render 대시보드에서
      # DART_DETECTIVE_LLM=on + ANTHROPIC_API_KEY(secret)를 추가한다.
      - key: DART_DETECTIVE_LLM
        value: "off"
      # Retriever를 case별로 공유하므로 세션이 늘어도 메모리가 거의 늘지 않는다
      # (실측: 25세션 85.6MB). 여러 명이 동시에 들어와도 중간에 밀려나지 않도록 넉넉히.
      - key: DART_DETECTIVE_MAX_SESSIONS
        value: "100"
      - key: DART_DETECTIVE_SESSION_TTL
        value: "1800"
